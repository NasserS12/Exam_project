{% extends "base.html" %}

{% block title %}الفصول{% endblock %}

{% block content %}
    <div class="page-head">
        <h1>الفصول</h1>
        <p>اختر الفصل اللي تبي تذاكره.</p>
    </div>

    <div class="card-grid">
        {% for chapter in chapters %}
            <article class="card chapter-card">
                <span class="chapter-num">{{ loop.index }}</span>
                <h2>{{ chapter["name"] }}</h2>
                <a class="btn btn-primary" href="/chapters/{{ chapter['id'] }}">ابدأ الاختبار</a>
            </article>
        {% endfor %}
    </div>
{% endblock %}
