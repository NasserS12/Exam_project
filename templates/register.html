{% extends "base.html" %}

{% block title %}إنشاء حساب{% endblock %}

{% block content %}
    <h1>إنشاء حساب</h1>

    {% if success %}
        <p>تم إنشاء الحساب بنجاح.</p>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        <label>
            اسم المستخدم
            <input type="text" name="username">
        </label>
        <br>
        <label>
            كلمة المرور
            <input type="password" name="password">
        </label>
        <br>
        <button type="submit">تسجيل</button>
    </form>

    <a href="/">الرئيسية</a>
{% endblock %}
