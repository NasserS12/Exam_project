<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}منصة الاختبارات{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/effects.js') }}" defer></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="page-glow" aria-hidden="true"></div>
    <div class="page-grid" aria-hidden="true"></div>
    <div class="page-noise" aria-hidden="true"></div>

    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <span class="brand-mark">
                    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
                </span>
                منصة الاختبارات
            </a>

            <nav class="nav" aria-label="القائمة الرئيسية">
                {% if session.get("user_id") %}
                    <a class="nav-link" href="/" {% if request.endpoint in ("home", "subject", "chapter_quiz") %}aria-current="page"{% endif %}>المواد</a>
                    <a class="nav-link" href="/results" {% if request.endpoint == "results_page" %}aria-current="page"{% endif %}>نتائجي</a>
                    <span class="nav-sep"></span>
                {% endif %}

                <button type="button" id="theme-toggle" class="icon-btn" aria-label="تبديل الوضع الداكن" title="تبديل الوضع الداكن">
                    <svg class="icon-sun" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon-moon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>

                {% if session.get("user_id") %}
                    <span class="nav-user">مرحباً {{ session["username"] }}</span>
                    <form class="inline-form" method="post" action="/logout">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-secondary btn-small">خروج</button>
                    </form>
                {% else %}
                    <a class="btn btn-secondary btn-small" href="/login">تسجيل الدخول</a>
                    <a class="btn btn-primary btn-small" href="/register">إنشاء حساب</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        <div class="container {% block container_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">منصة اختبارات لمراجعة المواد</div>
    </footer>
</body>
</html>
