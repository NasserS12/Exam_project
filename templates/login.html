{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
    <h1>تسجيل الدخول</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    
    <form method="post">
        <label>
            اسم المستخدم
            <input type="text" name="username">
        </label>
        <br>
        <label>
            كلمة المرور
            <input type="password" name="password">
        </label>
        <br>
        <button type="submit">تسجيل الدخول</button>
    </form>
    
    <p>ما عندك حساب؟ <a href="/register">إنشاء حساب</a></p>

    <a href="/">الرئيسية</a>
{% endblock %}
