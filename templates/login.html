{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block container_class %}container-small{% endblock %}

{% block content %}
    <section class="card form-card">
        <div class="page-head">
            <h1>تسجيل الدخول</h1>
            <p>ادخل حسابك وكمّل اختباراتك.</p>
        </div>

        {% if error %}
            <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form class="form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="username">اسم المستخدم</label>
                <input class="input" id="username" type="text" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">كلمة المرور</label>
                <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">دخول</button>
        </form>

        <p class="form-footer">ما عندك حساب؟ <a href="/register">إنشاء حساب</a></p>
    </section>
{% endblock %}
