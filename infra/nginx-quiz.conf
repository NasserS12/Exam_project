map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $login_limit_key zone=login:10m rate=10r/m;

server {
    server_name nasser-exam.duckdns.org;

    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /register {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nasser-exam.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nasser-exam.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_tokens off;

    if ($host = nasser-exam.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name nasser-exam.duckdns.org;
    return 404; # managed by Certbot
}
