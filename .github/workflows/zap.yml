name: ZAP Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with throwaway secrets
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_USER=quiz_admin"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=quiz"
            echo "APP_DB_USER=quiz_app"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Start the app
        run: docker compose up -d --build

      - name: Wait until the app answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/login > /dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
